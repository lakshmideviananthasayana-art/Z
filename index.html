<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quire: write books on A4 sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;500;600;700&family=Libre+Franklin:ital,wght@0,400;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;600;700&family=Poppins:ital,wght@0,400;0,600;1,400&family=Montserrat:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#d6dde2; --bar:#f7f9fa; --line:#c5ced5; --ui:#16222a; --muted:#5a6a75;
  --accent:#2a6d8e; --on-accent:#fff; --hover:rgba(22,34,42,.08); --card:#fff; --danger:#b3372f;
  --ui-font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Newsreader','Iowan Old Style',Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#161f26; --bar:#212d35; --line:#34444f; --ui:#e7eef2; --muted:#9aabb6;
    --accent:#7cc0de; --on-accent:#0d1a21; --hover:rgba(255,255,255,.09); --card:#2a3a44; --danger:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --desk:#161f26; --bar:#212d35; --line:#34444f; --ui:#e7eef2; --muted:#9aabb6;
  --accent:#7cc0de; --on-accent:#0d1a21; --hover:rgba(255,255,255,.09); --card:#2a3a44; --danger:#ff8a80;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--desk);color:var(--ui);font:15px/1.4 var(--ui-font)}
#root{height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}
:focus,:focus-visible{outline:none}
button:focus,button:focus-visible,select:focus,input:focus,input:focus-visible{outline:none!important;box-shadow:none}
button::-moz-focus-inner{border:0}

/* ---------- shared controls ---------- */
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bar);font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.link{background:none;border:0;padding:2px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.link:hover{color:var(--danger)}
.dim{color:var(--muted)}

/* ---------- library ---------- */
.lib{height:100%;overflow:auto;padding:36px clamp(16px,5vw,64px) 60px}
.libwrap{max-width:1040px;margin:0 auto}
.libhead{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:38px}
.wordmark{font:600 clamp(38px,6vw,56px)/1 var(--serif);letter-spacing:-.02em}
.tag{margin:10px 0 0;color:var(--muted);max-width:34ch}
.libacts{display:flex;flex-wrap:wrap;gap:8px}
.shelf{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:26px 22px}
.shelf>.book,.shelf>.newtile{width:120px;flex:none}
.book{display:flex;flex-direction:column;gap:12px}
.cover{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:210/297;width:100%;background:var(--c);color:#fff;border-radius:3px 9px 9px 3px;padding:16% 10% 11% 18%;box-shadow:inset 6px 0 0 rgba(0,0,0,.24),inset 7px 0 0 rgba(255,255,255,.14),0 8px 16px rgba(0,0,0,.26);transition:transform .15s ease}
.cover:hover{transform:translateY(-4px)}
.ct{font:600 15px/1.15 var(--serif);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ca{font:400 11px/1.3 var(--ui-font);opacity:.85;overflow-wrap:anywhere}
.binfo{font-size:12px;line-height:1.45;text-align:center}
.newtile{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:210/297;width:100%;border:2px dashed var(--line);border-radius:3px 9px 9px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:16px}
.newtile:hover{border-color:var(--accent);color:var(--ui)}
.note{margin:48px 0 0;color:var(--muted);font-size:13px;max-width:60ch}
.warn{background:var(--card);border:1px solid var(--danger);border-radius:10px;padding:12px 14px;margin-bottom:26px;font-size:14px}

/* ---------- editor ---------- */
.editor{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
.titleInput{flex:1;min-width:0;font:600 19px var(--serif);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px}
.titleInput:hover{border-color:var(--line)}
.savestate{font-size:13px;color:var(--muted);white-space:nowrap;min-width:5.5em;text-align:right}
.savestate.err{color:var(--danger)}
.tools{display:flex;align-items:center;gap:2px;padding:6px 12px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.tools select{height:34px;border-radius:6px;border:1px solid var(--line);background:var(--card);padding:0 8px;margin-right:4px}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.tb{min-width:34px;height:34px;padding:0 8px;border-radius:6px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tb b,.tb i,.tb u{font:600 16px/1 var(--serif)}
.tb i{font-weight:400}
.imgtools{display:inline-flex;align-items:center;gap:2px}
.tb:disabled{opacity:.35;cursor:default}.tb:disabled:hover{background:transparent}
.deskhold{position:relative;flex:1;min-height:0}
#desk{position:absolute;inset:0;overflow:auto;padding:22px 16px 90px;-webkit-overflow-scrolling:touch}
#wrap{position:relative;width:100%}
#sheets{position:absolute;top:0;left:0;width:210mm;transform-origin:0 0}
.status{display:flex;align-items:center;gap:16px;padding:6px 14px;background:var(--bar);border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.status .grow{flex:1}
.status .tb{height:30px;min-width:30px;color:var(--ui)}
.zoomLbl{min-width:3.4em;text-align:center}
.outline{position:absolute;left:0;top:0;bottom:0;width:min(310px,88%);background:var(--bar);border-right:1px solid var(--line);padding:14px;overflow:auto;z-index:5;box-shadow:6px 0 24px rgba(0,0,0,.18)}
.outline h2{margin:0 0 10px;font:600 17px var(--serif)}
.ol{display:flex;width:100%;justify-content:space-between;gap:12px;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px}
.ol:hover{background:var(--hover)}
.ol.l2{padding-left:22px;color:var(--muted);font-size:14px}
.ol .pg{color:var(--muted);flex:none}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:20;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px}
.menu button:hover{background:var(--hover)}
.menu small{display:block;color:var(--muted)}

/* editor-only touches on the sheet */
.content{caret-color:currentColor}
.content ::selection,.content::selection{background:rgba(42,109,142,.4)}
.content.empty>p:first-child::before{content:"Start writing your book here…";float:left;height:0;color:#9aa5ad;text-indent:0;pointer-events:none}
.content figure{cursor:pointer;border-radius:3px;-webkit-touch-callout:none}
.content figure img{-webkit-user-select:none;user-select:none}
.content figure,.content figure.sel,.content figure:focus,.content figure img,.content figure img:focus{outline:none!important;border:0}
.content figure,.content figure img{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:none!important;background:transparent}
.content figure figcaption{-webkit-user-select:text;user-select:text}
.content figure::selection,.content figure img::selection{background:transparent!important}
.content figure::-moz-selection,.content figure img::-moz-selection{background:transparent!important}
#figPop{position:fixed;z-index:30;width:min(290px,calc(100vw - 16px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px 8px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
#figPop .fsz{display:flex;align-items:center;gap:10px;padding:0 6px 8px;font-size:13px;color:var(--muted)}
#figPop .fsz input{flex:1;min-width:0;accent-color:var(--accent);height:24px}
#figPop .fsz output{min-width:3em;text-align:right;color:var(--ui)}
#figPop .row{display:flex;align-items:center;justify-content:space-between;gap:2px}
#figPop .sep{margin:0 2px}
#figPop .tb{min-width:34px;height:34px;font-size:13px}
.content figcaption{min-height:1.35em;cursor:text}
.content figure:not(.sel) figcaption:empty{display:none}
.layer figure.free{cursor:move}
.layer figure.free,.layer figure.free.sel,.layer figure.free:focus,.layer figure.free img{outline:none!important;border:0}
.layer figure.free.sel{touch-action:none}
.layer figure.free.sel::after{content:"";position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:50%;background:#2a6d8e;border:2px solid #fff;cursor:nwse-resize}
.layer figure.free.crop{overflow:hidden;cursor:default}
.layer figure.free.crop::after{display:none}
.szi{width:62px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:0 6px;margin-right:4px}
.cg input{width:64px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:0 6px}
#sheets.reading .content{caret-color:transparent}
#sheets.reading .content.empty>p:first-child::before{content:none}
#sheets.reading .layer figure.free{cursor:default}
.content figure.crop{position:relative;overflow:hidden;touch-action:none}
.cbox{position:absolute;border:2px solid #e08a00;box-shadow:0 0 0 400mm rgba(255,255,255,.65);pointer-events:none}
.content figcaption:empty::before{content:"Add a caption";color:#a3adb5}

/* ---------- modal + toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(10,18,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--bar);border:1px solid var(--line);border-radius:14px;width:min(460px,100%);max-height:100%;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal h2{margin:0 0 14px;font:600 22px var(--serif)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field select{width:100%;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:0 10px}
.swatches,.fontpick{display:flex;flex-wrap:wrap;gap:8px}
.swatches label,.fontpick label{cursor:pointer}
.swatches input,.fontpick input{position:absolute;opacity:0;pointer-events:none}
.sw{display:block;width:34px;height:34px;border-radius:8px;background:var(--c);border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--bar)}
.swatches input:checked+.sw{border-color:var(--ui)}
.fp{display:block;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:15px}
.fontpick input:checked+.fp{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ui);color:var(--desk);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,460px);z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3)}

@media (max-width:720px){
  .lbl{display:none}
  .bar{padding:6px 8px}
  .tools{padding:4px 8px}
  .savestate{min-width:0}
  .status{gap:10px;padding:5px 10px}
}
.ol.l1{font-weight:600}
.ol.l3{padding-left:36px;color:var(--muted);font-size:13px}
.tb.txt{font:600 13px var(--ui-font);min-width:38px}
.cg{display:inline-flex;align-items:center;gap:6px;padding:0 6px;flex:none;font-size:13px;color:var(--muted)}
.dot{width:22px;height:22px;min-width:22px;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--c);flex:none}
.dot:hover{border-color:var(--muted)}
.dot[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#fontSel{width:auto;max-width:150px}
@media (prefers-reduced-motion:reduce){.cover{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';

/* =========================================================
   Helpers and constants
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = n => Number(n || 0).toLocaleString();
const plural = (n, a, b) => `${fmt(n)} ${n === 1 ? a : b}`;

const COLORS = [['Petrol','#1f5666'],['Oxblood','#6e2a3a'],['Moss','#4c5d3c'],['Plum','#4d3763'],['Slate','#3c4556'],['Ochre','#a2742b']];
const FONTS = {
  serif: {name:'Serif', fam:'times', css:"'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif"},
  sans:  {name:'Sans', fam:'helvetica', css:"'Libre Franklin','Helvetica Neue',Arial,sans-serif"},
  type:  {name:'Typewriter', fam:'courier', css:"'Courier Prime','Courier New',monospace"},
  lora:  {name:'Lora', fam:'times', css:"'Lora',Georgia,serif"},
  merri: {name:'Merriweather', fam:'times', css:"'Merriweather',Georgia,serif"},
  garamond: {name:'EB Garamond', fam:'times', css:"'EB Garamond',Garamond,Georgia,serif"},
  playfair: {name:'Playfair Display', fam:'times', css:"'Playfair Display',Georgia,serif"},
  inter: {name:'Inter', fam:'helvetica', css:"'Inter','Helvetica Neue',Arial,sans-serif"},
  poppins: {name:'Poppins', fam:'helvetica', css:"'Poppins','Helvetica Neue',Arial,sans-serif"},
  montserrat: {name:'Montserrat', fam:'helvetica', css:"'Montserrat','Helvetica Neue',Arial,sans-serif"},
  mono:  {name:'Roboto Mono', fam:'courier', css:"'Roboto Mono','Courier New',monospace"},
  script: {name:'Dancing Script', fam:'times', css:"'Dancing Script','Brush Script MT',cursive"},
  hand:  {name:'Caveat', fam:'times', css:"'Caveat','Comic Sans MS',cursive"}
};
const fontKeyOf = fv => {
  fv = String(fv || '').toLowerCase();
  for (const [k, f] of Object.entries(FONTS)) { const first = f.css.split(',')[0].replace(/['"]/g, '').toLowerCase(); if (fv.includes(first)) return k; }
  return fv.includes('courier') ? 'type' : (fv.includes('helvetica') || fv.includes('sans')) ? 'sans' : (fv.includes('georgia') || fv.includes('serif')) ? 'serif' : '';
};
const SIZES = [11, 12, 13, 14];
const TEXT_BLOCKS = new Set(['P','H1','H2','H3','BLOCKQUOTE']);
const TOP_OK = new Set(['P','H1','H2','H3','BLOCKQUOTE','FIGURE']);

const ICON = {
  back:'<path d="M15 6l-6 6 6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>',
  page:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/>',
  chapter:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  scene:'<path d="M5 12h2M11 12h2M17 12h2"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  left:'<path d="M4 6h16M4 10h10M4 14h16M4 18h10"/>',
  center:'<path d="M4 6h16M7 10h10M4 14h16M7 18h10"/>',
  right:'<path d="M4 6h16M10 10h10M4 14h16M10 18h10"/>',
  justify:'<path d="M4 6h16M4 10h16M4 14h16M4 18h16"/>',
  read:'<path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>'
};
const icon = n => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* Sheet styles are shared by the editor and the exported web page. */
const SHEET_CSS = `
.sheet{--m:22mm;position:relative;width:210mm;height:297mm;padding:var(--m);margin:0 0 18px;background:var(--page,#fff);color:var(--ink,#1d232b);box-shadow:0 1px 2px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.18);overflow:hidden}
.content{height:calc(297mm - 2 * var(--m));overflow:hidden;outline:none;font-family:var(--book-font);font-size:var(--book-size);line-height:1.55;text-align:justify;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.content p{margin:0;text-indent:0}
.content p.cont,.content h1+p,.content h2+p,.content figure+p,.content blockquote+p,.content p.sb,.content p.sb+p{text-indent:0}
.content h1,.content h2,.content h3{line-height:1.25;font-weight:600;text-align:left;margin:1.1em 0 .45em}
.content h1{font-size:1.7em}
.content h2{font-size:1.35em}
.content h3{font-size:1.1em}
.content h1.chapter{font-size:2.1em;line-height:1.2;text-align:center;margin:1.4em 0 1.1em;text-wrap:balance}
.content h3+p{text-indent:0}
.content blockquote{margin:.9em 2.2em;font-style:italic;text-indent:0;padding-left:1em;border-left:2px solid #c6cdd3}
.content p.sb{text-align:center;letter-spacing:.35em;margin:1em 0}
.content figure{margin:0;text-align:center;text-indent:0}
.content figure img{box-sizing:border-box;display:block;margin:0 auto;width:65%;height:auto;max-height:195mm;object-fit:contain}
.content figure.s img{width:38%}
.content figure.l img{width:100%}
.content figure.al img{margin-left:0}.content figure.ar img{margin-right:0}

.content figcaption{font-size:.8em;font-style:italic;text-align:center;margin-top:.45em;color:inherit;opacity:.75;line-height:1.35}
.layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.layer figure.free{position:absolute;margin:0;pointer-events:auto}
.layer figure.free img{box-sizing:border-box;display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.num{position:absolute;left:0;right:0;bottom:9mm;text-align:center;font:400 11px/1 var(--book-font);color:inherit;opacity:.6;user-select:none;-webkit-user-select:none}
`;
document.head.appendChild(Object.assign(document.createElement('style'), {textContent: SHEET_CSS}));

/* =========================================================
   Storage (IndexedDB, with an in-memory fallback)
   ========================================================= */
let db = null;
const mem = {meta: new Map(), content: new Map()};

function openDB() {
  return new Promise((res, rej) => {
    try {
      const rq = indexedDB.open('quire', 1);
      rq.onupgradeneeded = () => {
        const d = rq.result;
        d.createObjectStore('meta', {keyPath: 'id'});
        d.createObjectStore('content', {keyPath: 'id'});
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
      rq.onblocked = () => rej(new Error('blocked'));
    } catch (e) { rej(e); }
  });
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txDone = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });

let ls = null;                 // localStorage fallback when IndexedDB is unavailable
const LSM = 'quire:meta:', LSC = 'quire:content:';
function lsInit() { try { localStorage.setItem('quire:t', '1'); localStorage.removeItem('quire:t'); ls = localStorage; } catch (e) { ls = null; } }
const lsGet = k => { try { return JSON.parse(ls.getItem(k)); } catch (e) { return null; } };

async function listMeta() {
  if (db) return reqP(db.transaction('meta').objectStore('meta').getAll());
  if (ls) { const out = []; for (let i = 0; i < ls.length; i++) { const k = ls.key(i); if (k && k.startsWith(LSM)) { const v = lsGet(k); if (v) out.push(v); } } return out; }
  return [...mem.meta.values()];
}
async function getMeta(id) { return db ? reqP(db.transaction('meta').objectStore('meta').get(id)) : ls ? lsGet(LSM + id) : mem.meta.get(id); }
async function loadContent(id) { return db ? reqP(db.transaction('content').objectStore('content').get(id)) : ls ? lsGet(LSC + id) : mem.content.get(id); }
async function saveBook(meta, pages) {
  if (!db) {
    if (ls) { ls.setItem(LSC + meta.id, JSON.stringify({id: meta.id, pages})); ls.setItem(LSM + meta.id, JSON.stringify(meta)); return; }
    mem.meta.set(meta.id, meta); mem.content.set(meta.id, {id: meta.id, pages}); return;
  }
  const t = db.transaction(['meta', 'content'], 'readwrite');
  t.objectStore('meta').put(meta);
  t.objectStore('content').put({id: meta.id, pages});
  await txDone(t);
}
async function removeBook(id) {
  if (!db) {
    if (ls) { ls.removeItem(LSM + id); ls.removeItem(LSC + id); return; }
    mem.meta.delete(id); mem.content.delete(id); return;
  }
  const t = db.transaction(['meta', 'content'], 'readwrite');
  t.objectStore('meta').delete(id);
  t.objectStore('content').delete(id);
  await txDone(t);
}

function modal({title, body, actions}) {
  const prev = document.activeElement;
  const back = document.createElement('div');
  back.className = 'backdrop';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${esc(title)}</h2><div class="mbody"></div><div class="mact"></div></div>`;
  const mb = $('.mbody', back);
  if (typeof body === 'string') mb.innerHTML = body; else mb.append(body);
  const onKey = e => { if (e.key === 'Escape') close(); };
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus({preventScroll: true}); };
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.kind || '');
    b.textContent = a.label;
    b.addEventListener('click', () => { const r = a.onClick ? a.onClick(back) : undefined; if (r !== false) close(); });
    $('.mact', back).append(b);
  });
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  document.addEventListener('keydown', onKey);
  document.body.append(back);
  const first = $('input,select,button', back);
  if (first) first.focus();
  return {close, el: back};
}

function confirmModal(title, text, label, onConfirm) {

}

function ago(t) {
  const d = Date.now() - t, m = 60000;
  if (d < m) return 'just now';
  if (d < 60 * m) return Math.floor(d / m) + ' min ago';
  if (d < 24 * 60 * m) { const h = Math.floor(d / (60 * m)); return h + (h === 1 ? ' hour' : ' hours') + ' ago'; }
  const dd = Math.floor(d / (24 * 60 * m));
  if (dd < 30) return dd + (dd === 1 ? ' day' : ' days') + ' ago';
  return new Date(t).toLocaleDateString();
}

const fileSafe = s => (String(s || '').replace(/[\\/:*?"<>|]+/g, '').trim().slice(0, 80)) || 'book';

async function saveData(name, data) {
  if (dl) return dl.save({filename: name, data});
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function saveFile(name, data) {
  try {
    await saveData(name, data);
  } catch (err) {
    if (err && err.code === 'declined') return;
    toast('Couldn’t save that file.');
  }
}

    const open = e.target.closest('[data-open]');
    if (open) { openBook(open.dataset.open); return; }
    const del = e.target.closest('[data-del]');
    if (del) {
      const b = list.find(x => x.id === del.dataset.del);

async function newBook() {
  const m = {id: uid(), title: 'Untitled book', author: '', color: COLORS[0][1], font: 'serif', size: 12, v2: 1, updated: Date.now(), words: 0, pages: 1};
  await saveBook(m, [{hb: false, html: '<p><br></p>'}]);
  meta = m;
  buildEditor([{hb: false, html: '<p><br></p>'}], true);
}

async function openBook(id) {
  const m = await getMeta(id);
  if (!m) return;
  const c = await loadContent(id);
  meta = m;
  const pages = c && c.pages && c.pages.length ? c.pages : [{hb: false, html: '<p><br></p>'}];
  buildEditor(pages, false);
}

async function backupAll(list) {
  if (!list.length) { toast('There are no books to back up yet.'); return; }
  const books = [];
  for (const m of list) { const c = await loadContent(m.id); books.push({meta: m, pages: c ? c.pages : []}); }
  saveFile('quire-backup.json', JSON.stringify({app: 'quire', version: 1, exported: new Date().toISOString(), books}));
}

async function restoreFromFile(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.books)) throw new Error('bad');
    const existing = new Set((await listMeta()).map(b => b.id));
    let n = 0;
    for (const b of data.books) {
      if (!b || !b.meta || !Array.isArray(b.pages)) continue;
      const m = {...b.meta};
      if (!m.id || existing.has(m.id)) m.id = uid();
      existing.add(m.id);
      m.updated = m.updated || Date.now();
      await saveBook(m, b.pages);
      n++;
    }
    toast(n ? `Restored ${plural(n, 'book', 'books')}` : 'That file has no books in it.');
    showLibrary();
  } catch (e) { toast('That doesn’t look like a Quire backup.'); }
}

function inkFor(h) { const n = parseInt(h.slice(1), 16); return (.299 * (n >> 16) + .587 * ((n >> 8) & 255) + .114 * (n & 255)) < 140 ? '#f1f3f5' : '#1d232b'; }
const PAGE_NAMES = {'#ffffff': 'white', '#f3ead3': 'paper', '#16191d': 'black'};
function changePage(pg) {
  const old = meta.page || '#ffffff';
  if (pg === old) return;
  const prevInk = meta.ink || inkFor(old), rec = inkFor(pg);
  meta.page = pg; meta.ink = prevInk;
  applyBookStyle(); markDirty();
  if (prevInk === rec) return;
  const light = rec === '#f1f3f5';
  modal({
    title: 'Change the text colour too?',
    body: `<p style="margin:0">Text is easier to read on a ${PAGE_NAMES[pg] || 'new'} page when it is ${light ? 'light' : 'dark'}. We recommend switching to ${light ? 'light' : 'dark'} text.</p>`,
    actions: [
      {label: 'Keep current text'},
      {label: `Use ${light ? 'light' : 'dark'} text`, kind: 'primary', onClick: () => {
        meta.ink = rec;
        sheetsEl.querySelectorAll('.content [style*="color"]').forEach(el => {
          el.style.removeProperty('color');
          if (!el.getAttribute('style')) { el.removeAttribute('style'); if (el.tagName === 'SPAN' && !el.className) el.replaceWith(...el.childNodes); }
        });
        sheetsEl.querySelectorAll('.content font[color]').forEach(el => el.removeAttribute('color'));
        applyBookStyle(); markDirty();
      }}
    ]
  });
}
function applyBookStyle() {
  const pg = meta.page || '#ffffff', ink = meta.ink || inkFor(pg);
  sheetsEl.style.setProperty('--page', pg); sheetsEl.style.setProperty('--ink', ink);
  document.querySelectorAll('[data-page]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.page === pg)));
  const f = FONTS[meta.font] || FONTS.serif;
  sheetsEl.style.setProperty('--book-font', f.css);
  sheetsEl.style.setProperty('--book-size', (meta.size || 12) + 'pt');

function makeSheet(html, hb, free) {
  const s = document.createElement('section');
  s.className = 'sheet';
  if (hb) s.dataset.hb = '1';
  s.innerHTML = `<div class="content" contenteditable="true" spellcheck="true" lang="en" role="textbox" aria-multiline="true" aria-label="Page text">${html || '<p><br></p>'}</div><div class="num" contenteditable="false"></div><div class="layer">${free || ''}</div>`;

    const im = f.querySelector('img');
    f.classList.add(f.classList.contains('wr') ? 'ar' : 'al'); f.classList.remove('wl', 'wr', 'tg');
    if (im && f.style.width) im.style.width = f.style.width;
    f.style.width = ''; if (!f.getAttribute('style')) f.removeAttribute('style');
  });
  s.querySelectorAll('figure').forEach(f => { f.tabIndex = -1; });
  return s;
}

const ZSTEPS = [0.5, 0.65, 0.8, 0.9, 1, 1.15, 1.3, 1.5];
function curScale() {
  if (zoomMode === 'fit') return Math.min(1, Math.max(0.2, (deskEl.clientWidth - 32) / sheetsEl.offsetWidth));
  return zoomMode;
}
function fitScale() {
  if (!sheetsEl || !deskEl) return;
  const W = sheetsEl.offsetWidth, s = curScale();
  sheetsEl.style.transform = `scale(${s})`;
  wrapEl.style.height = (sheetsEl.offsetHeight * s + 8) + 'px';
  sheetsEl.style.left = Math.max(0, (wrapEl.clientWidth - W * s) / 2) + 'px';
  const l = $('#zoomLbl'); if (l) l.textContent = Math.round(s * 100) + '%';
  placePop();
}
function zoomStep(dir) {
  const s = curScale();
  let next = null;
  if (dir > 0) next = ZSTEPS.find(z => z > s + 0.01);
  else for (const z of ZSTEPS) if (z < s - 0.01) next = z;
  if (next) { zoomMode = next; fitScale(); }
}

/* =========================================================
   Saving
   ========================================================= */
/* Undo / redo: snapshots of the whole book, grouped while typing */
let hist = [], hpos = -1, histTimer = 0, histPending = false, restoringH = false;
const imgIds = new Map(), imgList = [];
const packH = h => (h || '').replace(/src="(data:[^"]*)"/g, (m, u) => { let i = imgIds.get(u); if (i === undefined) { i = imgList.length; imgList.push(u); imgIds.set(u, i); } return `src="@@${i}"`; });
const unpackH = h => (h || '').replace(/src="@@(\d+)"/g, (m, i) => `src="${imgList[+i]}"`);
function snapH() {
  const pages = bookPages().map(q => ({hb: q.hb, html: packH(q.html), free: packH(q.free)}));
  const st = {page: meta.page, ink: meta.ink, font: meta.font, size: meta.size};
  return {pages, st, key: JSON.stringify([pages, st])};
}
function updateUR() {
  const u = $('#undoBtn'), r = $('#redoBtn'); if (!u || !r) return;
  u.disabled = !(histPending || hpos > 0); r.disabled = hpos >= hist.length - 1;
}
function schedHist() { histPending = true; clearTimeout(histTimer); histTimer = setTimeout(pushHist, 450); updateUR(); }
function pushHist() {
  clearTimeout(histTimer); histPending = false;
  if (restoringH || view !== 'ed' || !sheetsEl) return;
  const sn = snapH();
  if (hist[hpos] && hist[hpos].key === sn.key) { updateUR(); return; }
  hist.length = hpos + 1; hist.push(sn);
  if (hist.length > 80) hist.shift();
  hpos = hist.length - 1; updateUR();
}
function resetHist() { imgIds.clear(); imgList.length = 0; clearTimeout(histTimer); histPending = false; hist = []; hpos = -1; pushHist(); }
function applyH(sn, from) {
  restoringH = true;
  try {
    deselectFig();
    sheetsEl.textContent = '';
    sn.pages.forEach(q => sheetsEl.append(makeSheet(unpackH(q.html), q.hb, unpackH(q.free))));
    Object.assign(meta, sn.st);
    applyBookStyle(); renumber(); updateStatus(); markDirty();
    let idx = 0;
    if (from) { const n = Math.max(from.pages.length, sn.pages.length); for (; idx < n; idx++) if (JSON.stringify(from.pages[idx]) !== JSON.stringify(sn.pages[idx])) break; }
    idx = Math.min(idx, sheetsEl.children.length - 1);
    if (!reading) { try { focusEnd(contentAt(idx)); } catch (x) {} }
  } finally { restoringH = false; }
  updateUR();
}
function undoH() {
  if (histPending) pushHist();
  if (hpos <= 0) return;
  const from = hist[hpos]; hpos--; applyH(hist[hpos], from);
}
function redoH() {
  if (histPending) pushHist();
  if (hpos >= hist.length - 1) return;
  const from = hist[hpos]; hpos++; applyH(hist[hpos], from);
}

function setSave(state) {
  const el = $('#saveState'); if (!el) return;
  el.classList.toggle('err', state === 'error');
  el.textContent = state === 'saving' ? 'Saving…' : state === 'error' ? 'Not saved' : 'Saved';
}
function markDirty() {
  dirty = true;
  if (!restoringH) schedHist();
  setSave('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveNow(false), 300);
  scheduleStatus();
}
function serialize(sheet) {
  const c = sheet.firstElementChild.cloneNode(true);
  c.querySelectorAll('.cm').forEach(m => m.remove());
  c.querySelectorAll('.cbox').forEach(x => x.remove());
  c.querySelectorAll('figure').forEach(f => { f.classList.remove('sel', 'crop'); f.removeAttribute('tabindex'); ['cl','cr','ct','cb'].forEach(k => f.removeAttribute('data-' + k)); });
  return c.innerHTML;
}
function serializeLayer(sheet) {
  const l = sheet.querySelector('.layer'); if (!l) return '';
  const c = l.cloneNode(true);
  c.querySelectorAll('.cbox').forEach(x => x.remove());
  c.querySelectorAll('figure').forEach(f => { f.classList.remove('sel', 'crop'); f.removeAttribute('tabindex'); ['cl','cr','ct','cb'].forEach(k => f.removeAttribute('data-' + k)); });
  return c.innerHTML;
}
const bookPages = () => sheetList().map(s => ({hb: !!s.dataset.hb, html: serialize(s), free: serializeLayer(s)}));

async function saveNow(announce) {
  if (!meta || !sheetsEl) return;
  clearTimeout(saveTimer);
  try {
    const pages = bookPages();
    meta.updated = Date.now(); meta.pages = pages.length; meta.words = countWords();
    await saveBook({...meta}, pages);
    dirty = false;
    setSave('saved');
    if (announce) toast('Saved');
  } catch (err) {
    console.error(err);
    setSave('error');
    toast('Couldn’t save. Your browser may be out of space. Export a copy to be safe.');
  }
}
async function flushSave() { if (dirty && meta && sheetsEl) await saveNow(false); }

/* =========================================================
   Book details dialog
   ========================================================= */
function openDetails() {
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <label class="field"><span>Title</span><input type="text" id="dTitle" maxlength="120" value="${esc(meta.title)}"></label>
    <label class="field"><span>Author</span><input type="text" id="dAuthor" maxlength="80" value="${esc(meta.author)}"></label>
    <div class="field"><span>Cover color</span><div class="swatches">${COLORS.map(([n, h]) => `<label><input type="radio" name="dColor" value="${h}" ${h === meta.color ? 'checked' : ''} aria-label="${n}"><span class="sw" style="--c:${h}"></span></label>`).join('')}</div></div>
    <div class="field"><span>Typeface</span><div class="fontpick">${Object.entries(FONTS).map(([k, f]) => `<label><input type="radio" name="dFont" value="${k}" ${k === meta.font ? 'checked' : ''}><span class="fp" style="font-family:${f.css}">${f.name}</span></label>`).join('')}</div></div>
    <label class="field"><span>Text size</span><select id="dSize">${SIZES.map(z => `<option value="${z}" ${z === meta.size ? 'selected' : ''}>${z} pt</option>`).join('')}</select></label>`;
  modal({title: 'Book details', body: wrap, actions: [
    {label: 'Cancel'},
    {label: 'Apply', kind: 'primary', onClick: back => {
      const oldF = meta.font, oldS = meta.size;
      meta.title = $('#dTitle', back).value;
      meta.author = $('#dAuthor', back).value;
      meta.color = ($('input[name=dColor]:checked', back) || {}).value || meta.color;
      meta.font = ($('input[name=dFont]:checked', back) || {}).value || meta.font;
      meta.size = +$('#dSize', back).value;
      $('#titleInput').value = meta.title;
      applyBookStyle();
      if (oldF !== meta.font || oldS !== meta.size) {
        if (document.fonts && document.fonts.load) document.fonts.load(`16px ${(FONTS[meta.font] || FONTS.serif).css.split(',')[0]}`).finally(() => { relayoutAll(); updateStatus(); markDirty(); });
        else { relayoutAll(); updateStatus(); }
      }
      markDirty();
    }}
  ]});
}

/* =========================================================
   Export
   ========================================================= */

const loadScript = src => new Promise((res, rej) => {
  const el = document.createElement('script');
  el.src = src; el.onload = res; el.onerror = () => rej(new Error('load ' + src));
  document.head.appendChild(el);
});
let pdfLibs = null;
function loadPdfLibs() {
  if (!pdfLibs) pdfLibs = Promise.all([
    (window.jspdf && window.jspdf.jsPDF) ? 0 : loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
  ]).catch(e => { pdfLibs = null; throw e; });
  return pdfLibs;
}
let pdfBusy = false;
const PX = 25.4 / 96;
const rgbOf = c => (String(c).match(/[\d.]+/g) || [0, 0, 0]).slice(0, 3).map(Number);
const famOf = f => { const k = fontKeyOf(f); return k ? FONTS[k].fam : 'times'; };
function drawSheet(pdf, clone) {
  const o = clone.getBoundingClientRect();
  pdf.setFillColor(...rgbOf(getComputedStyle(clone).backgroundColor)); pdf.rect(0, 0, 210, 297, 'F');
  clone.querySelectorAll('blockquote').forEach(q => {
    const r = q.getBoundingClientRect(), x = (r.left - o.left + 1) * PX;
    pdf.setDrawColor(...rgbOf(getComputedStyle(q).borderLeftColor)); pdf.setLineWidth(.5);
    pdf.line(x, (r.top - o.top) * PX, x, (r.bottom - o.top) * PX);
  });
  clone.querySelectorAll('figure img').forEach(im => {
    try {
      const r = im.getBoundingClientRect(), cv = document.createElement('canvas'), png = /^data:image\/png/.test(im.src);
      cv.width = im.naturalWidth; cv.height = im.naturalHeight;
      const cx = cv.getContext('2d'); if (!png) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); }
      cx.drawImage(im, 0, 0);
      const cs = getComputedStyle(im), bw = (parseFloat(cs.borderTopWidth) || 0) * PX, X = (r.left - o.left) * PX, Y = (r.top - o.top) * PX, Wd = r.width * PX;
      /* width comes from the page; height always follows the picture's own proportions, so it can never be squeezed or stretched */
      const ratio = im.naturalWidth && im.naturalHeight ? im.naturalHeight / im.naturalWidth : r.height / (r.width || 1);
      let dw = Wd - 2 * bw, dh = dw * ratio;
      const mh = parseFloat(cs.maxHeight);
      if (isFinite(mh) && mh > 0 && dh > mh * PX) { dh = mh * PX; dw = dh / ratio; }
      const dx = X + bw + (Wd - 2 * bw - dw) / 2, dy = Y + bw, Ht = dh + 2 * bw;
      pdf.addImage(cv.toDataURL(png ? 'image/png' : 'image/jpeg', .92), png ? 'PNG' : 'JPEG', dx, dy, dw, dh);
      if (bw > 0) { pdf.setDrawColor(...rgbOf(getComputedStyle(im).borderTopColor)); pdf.setLineWidth(bw); pdf.rect(X + bw / 2, Y + bw / 2, Wd - bw, Ht - bw, 'S'); }
    } catch (e) {}
  });
  const w = document.createTreeWalker(clone, NodeFilter.SHOW_TEXT), rg = document.createRange();
  let n;
  while ((n = w.nextNode())) {
    if (!n.data.trim()) continue;
    const el = n.parentElement, cs = getComputedStyle(el), pt = parseFloat(cs.fontSize) * .75;
    const bold = (+cs.fontWeight || 400) >= 600, it = cs.fontStyle === 'italic', col = rgbOf(cs.color);
    let ul = false;
    for (let e = el; e && e !== clone.parentElement; e = e.parentElement) if ((getComputedStyle(e).textDecorationLine || '').includes('underline')) { ul = true; break; }
    pdf.setFont(famOf(cs.fontFamily), bold ? (it ? 'bolditalic' : 'bold') : (it ? 'italic' : 'normal')); pdf.setFontSize(pt); pdf.setTextColor(...col);
    const re = /\S+/g; let m;
    while ((m = re.exec(n.data))) {
      rg.setStart(n, m.index); rg.setEnd(n, m.index + m[0].length);
      const rects = [...rg.getClientRects()], parts = [];
      if (rects.length <= 1) { if (rects[0]) parts.push({t: m[0], r: rects[0]}); }
      else {
        let cur = null;
        for (let k = 0; k < m[0].length; k++) {
          rg.setStart(n, m.index + k); rg.setEnd(n, m.index + k + 1);
          const r = rg.getClientRects()[0]; if (!r) continue;
          if (cur && Math.abs(r.bottom - cur.r.bottom) < 2) { cur.t += m[0][k]; cur.r = {left: cur.r.left, right: r.right, bottom: r.bottom, height: r.height}; }
          else parts.push(cur = {t: m[0][k], r: {left: r.left, right: r.right, bottom: r.bottom, height: r.height}});
        }
        parts.slice(0, -1).forEach(p => { if (!/-$/.test(p.t)) p.t += '-'; });
      }
      for (const p of parts) {
        const t = p.t.replace(/[\u200b]/g, ''); if (!t) continue;
        const x = (p.r.left - o.left) * PX, y = (p.r.bottom - o.top - p.r.height * .2) * PX, tw = (p.r.right - p.r.left) * PX;
        const cs2 = t.length > 1 ? Math.max(-.25, Math.min(.25, (tw - pdf.getTextWidth(t)) / t.length)) : 0;
        pdf.text(t, x, y, {charSpace: cs2});
        if (ul) { pdf.setDrawColor(...col); pdf.setLineWidth(.2); pdf.line(x, y + .6, x + tw, y + .6); }
      }
    }
  }
}
async function exportPdf() {
  if (pdfBusy) return;
  pdfBusy = true;
  const stage = document.createElement('div');
  try {
    toast('Preparing PDF…', 0);
    finishCrop();
    await loadPdfLibs();
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({orientation: 'portrait', unit: 'mm', format: 'a4', compress: true});
    pdf.setProperties({title: meta.title || 'Untitled book', author: meta.author || ''});
    stage.style.cssText = 'position:fixed;left:-10000px;top:0;width:210mm;pointer-events:none';
    ['--book-font', '--book-size', '--page', '--ink'].forEach(v => stage.style.setProperty(v, sheetsEl.style.getPropertyValue(v)));
    document.body.appendChild(stage);
    const sheets = sheetList();
    for (let i = 0; i < sheets.length; i++) {
      toast(`Making PDF, page ${i + 1} of ${sheets.length}…`, 0);
      await new Promise(r => setTimeout(r, 20));
      const clone = sheets[i].cloneNode(true);
      clone.style.margin = '0'; clone.style.boxShadow = 'none';
      clone.querySelectorAll('.cm,.cbox').forEach(x => x.remove());
      clone.querySelectorAll('figcaption').forEach(fc => { if (!fc.textContent.trim()) fc.remove(); });
      clone.querySelectorAll('[contenteditable]').forEach(x => x.removeAttribute('contenteditable'));
      clone.firstElementChild.classList.remove('empty');
      stage.replaceChildren(clone);
      await Promise.all([...clone.querySelectorAll('img')].map(im => im.decode ? im.decode().catch(() => {}) : null));
      if (i > 0) pdf.addPage('a4', 'portrait');
      drawSheet(pdf, clone);
    }
    const buf = pdf.output('arraybuffer');
    toast('PDF ready', 2500);
    await saveData(fileSafe(meta.title) + '.pdf', new Blob([buf], {type: 'application/pdf'}));
  } catch (err) {
    if (err && err.code === 'declined') toast('PDF not saved.');
    else { console.error(err); toast('Couldn’t make the PDF. Check your connection and try again.', 5000); }
  } finally {
    stage.remove();
    pdfBusy = false;
  }
}

function exportHtml() {
  const f = FONTS[meta.font] || FONTS.serif;
  const body = bookPages().map((p, i) => {
    const t = document.createElement('div');
    t.innerHTML = p.html;
    t.querySelectorAll('figcaption').forEach(fc => { if (!fc.textContent.trim()) fc.remove(); });
    t.querySelectorAll('[contenteditable]').forEach(x => x.removeAttribute('contenteditable'));
    t.querySelectorAll('[spellcheck]').forEach(x => x.removeAttribute('spellcheck'));
    t.querySelectorAll('.cm').forEach(x => x.remove());
    return `<section class="sheet"><div class="content" lang="en">${t.innerHTML}</div><div class="num">${i + 1}</div><div class="layer">${p.free || ''}</div></section>`;
  }).join('\n');
  const doc = `<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="${esc(meta.author)}">
<title>${esc(meta.title || 'Untitled book')}</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:ital,wght@0,400;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;600;700&family=Poppins:ital,wght@0,400;0,600;1,400&family=Montserrat:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:0}
html,body{margin:0}
body{background:#6d7780;padding:24px 0;--book-font:${f.css};--book-size:${meta.size || 12}pt;--page:${meta.page || '#ffffff'};--ink:${meta.ink || inkFor(meta.page || '#ffffff')}}
.sheet{margin:0 auto 24px}
@media (max-width:820px){body{padding:8px 0}.sheet{zoom:.45;margin-bottom:12px}}
@media print{body{background:#fff;padding:0}.sheet{margin:0;box-shadow:none;zoom:1;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}}
${SHEET_CSS}
</style></head><body>
${body}
</body></html>`;
  saveFile(fileSafe(meta.title) + '.html', doc);
}
function exportTxt() {
  const out = [];
  if (meta.title) out.push(meta.title);
  if (meta.author) out.push('by ' + meta.author);
  sheetList().forEach(s => {
    for (const b of s.firstElementChild.children) {
      if (b.tagName === 'FIGURE') {
        const cap = (b.querySelector('figcaption') || {}).textContent || '';
        out.push(cap.trim() ? `[Image: ${cap.trim()}]` : '[Image]');
        continue;
      }
      const t = b.textContent.replace(/\u200b/g, '');
      if (b.classList.contains('cont') && out.length) out[out.length - 1] += t;
      else out.push(t);
    }
  });
  saveFile(fileSafe(meta.title) + '.txt', out.join('\n\n'));
}
function exportJson() {
  const pages = bookPages();
  const m = {...meta, pages: pages.length, words: countWords(), updated: Date.now()};
  saveFile(fileSafe(meta.title) + '-backup.json', JSON.stringify({app: 'quire', version: 1, exported: new Date().toISOString(), books: [{meta: m, pages}]}));
}
